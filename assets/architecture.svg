<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Agentic DataOps Command Center architecture</title><desc id="desc">An orchestrator claims a run, calls quality and analytics agents, then routes RCA through critic review and human approval before quarantine and audit. Dry runs skip remediation.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#8097b5"/></marker></defs><rect width="1200" height="800" rx="24" fill="#0b1322"/><g font-family="Arial,Helvetica,sans-serif"><text x="44" y="50" font-size="14" fill="#70e0c4" font-weight="700">AGENTIC DATAOPS</text><text x="44" y="90" font-size="34" fill="#f5f8ff" font-weight="700">Command Center</text><text x="44" y="121" font-size="18" fill="#c7d5e7" font-weight="400">Detect → measure → explain → approve → audit</text><rect x="44" y="153" width="280" height="128" rx="15" fill="#142238" stroke="#8097b5" stroke-width="1.5"/><text x="66" y="183" font-size="13" fill="#8097b5" font-weight="700">ENTRY</text><text x="66" y="214" font-size="21" fill="#f5f8ff" font-weight="700">Manual / daily trigger</text><text x="66" y="245" font-size="16" fill="#c7d5e7" font-weight="400">08:00 Europe/Berlin</text><text x="66" y="270" font-size="16" fill="#c7d5e7" font-weight="400">Provisional · unpublished</text><rect x="376" y="153" width="448" height="128" rx="15" fill="#142238" stroke="#70e0c4" stroke-width="1.5"/><text x="398" y="183" font-size="13" fill="#70e0c4" font-weight="700">WF-00 · ORCHESTRATION</text><text x="398" y="214" font-size="21" fill="#f5f8ff" font-weight="700">Prepare context + claim run</text><text x="398" y="245" font-size="16" fill="#c7d5e7" font-weight="400">Atomic PostgreSQL run/date uniqueness</text><text x="398" y="270" font-size="16" fill="#c7d5e7" font-weight="400">Repeated claim → skip before child calls</text><rect x="876" y="153" width="280" height="128" rx="15" fill="#142238" stroke="#f6c177" stroke-width="1.5"/><text x="898" y="183" font-size="13" fill="#f6c177" font-weight="700">CONTROL PLANE</text><text x="898" y="214" font-size="21" fill="#f5f8ff" font-weight="700">Ledger + failure alerts</text><text x="898" y="245" font-size="16" fill="#c7d5e7" font-weight="400">Separate dry-run namespace</text><text x="898" y="270" font-size="16" fill="#c7d5e7" font-weight="400">Gmail notifications</text><path d="M324 218 H376" fill="none" stroke="#8097b5" stroke-width="2" marker-end="url(#arrow)"/><path d="M824 218 H876" fill="none" stroke="#8097b5" stroke-width="2" marker-end="url(#arrow)"/><rect x="44" y="342" width="330" height="172" rx="15" fill="#142238" stroke="#70e0c4" stroke-width="1.5"/><text x="66" y="372" font-size="13" fill="#70e0c4" font-weight="700">WF-01</text><text x="66" y="403" font-size="21" fill="#f5f8ff" font-weight="700">Data Quality Monitor</text><text x="66" y="434" font-size="16" fill="#c7d5e7" font-weight="400">Five SQL checks → deterministic score</text><text x="66" y="459" font-size="16" fill="#c7d5e7" font-weight="400">Structured Gemini diagnosis</text><text x="66" y="484" font-size="16" fill="#c7d5e7" font-weight="400">Healthy → record outcome</text><rect x="435" y="342" width="330" height="172" rx="15" fill="#142238" stroke="#87b9ff" stroke-width="1.5"/><text x="457" y="372" font-size="13" fill="#87b9ff" font-weight="700">WF-02</text><text x="457" y="403" font-size="21" fill="#f5f8ff" font-weight="700">SQL Analytics Agent</text><text x="457" y="434" font-size="16" fill="#c7d5e7" font-weight="400">Schema → planner → query gate</text><text x="457" y="459" font-size="16" fill="#c7d5e7" font-weight="400">Execute SQL → structured insights</text><text x="457" y="484" font-size="16" fill="#c7d5e7" font-weight="400">Revenue change / baseline</text><rect x="826" y="342" width="330" height="172" rx="15" fill="#142238" stroke="#bdabff" stroke-width="1.5"/><text x="848" y="372" font-size="13" fill="#bdabff" font-weight="700">WF-03</text><text x="848" y="403" font-size="21" fill="#f5f8ff" font-weight="700">Incident RCA Agent</text><text x="848" y="434" font-size="16" fill="#c7d5e7" font-weight="400">Evidence → reasoning → critic</text><text x="848" y="459" font-size="16" fill="#c7d5e7" font-weight="400">Revision gate → structured RCA</text><text x="848" y="484" font-size="16" fill="#c7d5e7" font-weight="400">Facts separated from hypotheses</text><path d="M600 281 V312 H209 V342" fill="none" stroke="#8097b5" stroke-width="2" marker-end="url(#arrow)"/><path d="M374 428 H435" fill="none" stroke="#8097b5" stroke-width="2" marker-end="url(#arrow)"/><text x="381" y="414" font-size="12" fill="#c7d5e7" font-weight="400">Incident</text><path d="M765 428 H826" fill="none" stroke="#8097b5" stroke-width="2" marker-end="url(#arrow)"/><text x="773" y="414" font-size="12" fill="#c7d5e7" font-weight="400">Live path</text><rect x="44" y="596" width="330" height="128" rx="15" fill="#142238" stroke="#87b9ff" stroke-width="1.5"/><text x="66" y="626" font-size="13" fill="#87b9ff" font-weight="700">DRY RUN</text><text x="66" y="657" font-size="21" fill="#f5f8ff" font-weight="700">Report without remediation</text><text x="66" y="688" font-size="16" fill="#c7d5e7" font-weight="400">WF-01 + WF-02 results</text><text x="66" y="713" font-size="16" fill="#c7d5e7" font-weight="400">CRITICAL alert when applicable</text><rect x="435" y="596" width="330" height="128" rx="15" fill="#142238" stroke="#f6c177" stroke-width="1.5"/><text x="457" y="626" font-size="13" fill="#f6c177" font-weight="700">HUMAN CONTROL</text><text x="457" y="657" font-size="21" fill="#f5f8ff" font-weight="700">Approve or reject</text><text x="457" y="688" font-size="16" fill="#c7d5e7" font-weight="400">Gmail send-and-wait approval</text><text x="457" y="713" font-size="16" fill="#c7d5e7" font-weight="400">Rejected → audit + report</text><rect x="826" y="596" width="330" height="128" rx="15" fill="#142238" stroke="#70e0c4" stroke-width="1.5"/><text x="848" y="626" font-size="13" fill="#70e0c4" font-weight="700">APPROVED ACTION</text><text x="848" y="657" font-size="21" fill="#f5f8ff" font-weight="700">Quarantine + audit</text><text x="848" y="688" font-size="16" fill="#c7d5e7" font-weight="400">Duplicate quarantine</text><text x="848" y="713" font-size="16" fill="#c7d5e7" font-weight="400">Final DataOps incident report</text><path d="M600 514 V551 H209 V596" fill="none" stroke="#87b9ff" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="346" y="545" font-size="14" fill="#87b9ff" font-weight="400">dry_run = true → skip WF-03</text><path d="M991 514 V552 H600 V596" fill="none" stroke="#8097b5" stroke-width="2" marker-end="url(#arrow)"/><path d="M765 660 H826" fill="none" stroke="#8097b5" stroke-width="2" marker-end="url(#arrow)"/><text x="772" y="645" font-size="12" fill="#c7d5e7" font-weight="400">Approve</text><text x="44" y="768" font-size="15" fill="#99acc4" font-weight="400">Portfolio demo · credentials omitted · final scheduled production validation pending</text></g></svg>